name: "Deployment-For-gmodstore"
description: "Deploy scripts to gmodstore"
author: "Joshua Piper <gms-deployment@doctor-internet.dev>"
branding:
  icon: check
  color: blue

runs:
  using: node20
  main: "dist/index.js"

inputs:
  token:
    description: "GModStore API Token"
    required: true
  product:
    description: "The ID of the addon to deploy to."
    required: true
  version:
    description: "The new version name to deploy."
    required: true
  type:
    description: "The type of version to deploy. Can be stable, beta, alpha, private or demo. If omitted, uses '-type' at the end of version string (if it exists), otherwise uses stable"
    required: false
  changelog:
    description: "Markdown formatted changelog."
    required: true
    default: "No changelog."
  path:
    description: "Path to the addon. This must be in zip format."
    required: true
  baseurl:
    description: "API Base URL"
    required: true
    default: "https://api.gmodstore.com/v3/"
  dry-run:
    description: "Run every step except the upload itself, for validating a workflow without publishing. Defaults to false."
    required: false
  infer-type:
    description: "Intuit the release type from the version string, falling back to the type input. Defaults to true."
    required: false
  dryrun:
    description: "Deprecated: use 'dry-run' instead."
    required: false
    deprecationMessage: "The 'dryrun' input is deprecated. Use 'dry-run' instead."
  nointuit:
    description: "Deprecated: use 'infer-type' instead. The two are inverted, so 'nointuit: true' is equivalent to 'infer-type: false'."
    required: false
    deprecationMessage: "The 'nointuit' input is deprecated. Use 'infer-type: false' instead."
