name: Builds

on:
  #push:
  #  branches:
  #    - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Two releases running at once would race over tags and the dist commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # semantic-release works out the next version from the tag history, so
        # it needs the whole history rather than the default shallow clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # semantic-release tags, commits the bundle and publishes in one pass, so
      # there is no verification after this point. Everything that can fail the
      # release has to fail here instead.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build Action Bundle
        run: npm run build

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
